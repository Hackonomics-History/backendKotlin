spring:
  application:
    name: backendKotlin
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/myeconocoach}
    username: ${SPRING_DATASOURCE_USERNAME:econ_user}
    password: ${SPRING_DATASOURCE_PASSWORD:econ_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false    # schema already managed by Django migrations
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: hackonomics-spring
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SECURITY_JWT_JWKS_URL:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${SECURITY_JWT_ISSUER:}
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6380/0}
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # default 1h; overridden per cache name
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai-service:
  grpc:
    target: ${AI_SERVICE_GRPC_TARGET:localhost:50052}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api/docs/swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

kafka:
  topics:
    user-activities: user-activities
    retry-1: user-activities.retry-1
    retry-2: user-activities.retry-2
    dlt: user-activities.dlt
    news-refresh-request: news.refresh.request
    news-refresh-result: news.refresh.result
    blacklist-sync: blacklist-sync
