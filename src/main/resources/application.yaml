spring:
  application:
    name: backendKotlin

  devtools:
    restart:
      enabled: true

    livereload:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/myeconocoach}
    username: ${SPRING_DATASOURCE_USERNAME:econ_user}
    password: ${SPRING_DATASOURCE_PASSWORD:econ_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: hackonomics-spring
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6380/0}
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # default 1h; overridden per cache name
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai-service:
  grpc:
    target: ${AI_SERVICE_GRPC_TARGET:localhost:50052}
  internal-token: ${AI_SERVICE_INTERNAL_TOKEN}

fastapi:
  rest:
    url: ${FASTAPI_REST_URL:http://localhost:8000}

central-auth:
  service-key: ${CENTRAL_AUTH_SERVICE_KEY}
  grpc:
    target: ${CENTRAL_AUTH_GRPC_TARGET:localhost:50051}

kotlin:
  service-key: ${KOTLIN_SERVICE_KEY}

restcountries:
  api-key: ${COUNTRIES_API_KEY}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api/docs/swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

kafka:
  topics:
    user-activities: user-activities
    retry-1: user-activities.retry-1
    retry-2: user-activities.retry-2
    dlt: user-activities.dlt
    news-refresh-request: news.refresh.request
    news-refresh-result: news.refresh.result
    blacklist-sync: blacklist-sync
