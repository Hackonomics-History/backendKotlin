name: CI — backendKotlin (Spring Boot)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# ─────────────────────────────────────────────────────────────────────────────
# Three-stage test pipeline
#
# ① unit-test      — compile + run tests that do NOT require external services.
#                    Kafka AutoConfiguration is excluded via src/test/resources/application.yaml
#                    so no broker connection is attempted.
#                    Proto stubs generated via Gradle protobuf plugin.
#
# ② integration-test — runs ./gradlew integrationTest against real PostgreSQL and Redis
#                    service containers plus an in-process @EmbeddedKafka broker.
#                    Uses Spring Test context caching via BaseIntegrationTest to keep
#                    broker-startup overhead to a single instance per CI run.
#                    Runs after unit-test passes.
#
# ③ docker-build   — builds the multi-stage Docker image (no push) to verify
#                    the Dockerfile and build context are valid.
#                    Runs in parallel with ② (both need only unit-test).
#
# Checkout pattern:
#   • backendKotlin repo   → path: backendKotlin/
#   • proto repo           → path: proto/
#   Gradle's srcDir("../proto") resolves to proto/ ✓
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  run:
    working-directory: backendKotlin

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ① Unit Tests
  # No external services. KafkaAutoConfiguration is explicitly excluded via
  # src/test/resources/application.yaml so the Spring context (if loaded) never
  # attempts broker connections — no retry loops, no timeout delays.
  # ──────────────────────────────────────────────────────────────────────────
  unit-test:
    name: "1. Build & Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backendKotlin
        uses: actions/checkout@v4
        with:
          path: backendKotlin

      - name: Checkout proto
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Generate proto stubs
        run: ./gradlew generateProto --no-daemon

      - name: Build (skip tests)
        run: ./gradlew assemble --no-daemon -x test

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Verify self-containment (no external services)
        run: echo "✓ Unit tests passed without Kafka, Redis, or Postgres"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backendKotlin/build/reports/tests/test/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # ② Integration Tests
  # Runs ./gradlew integrationTest (src/integrationTest sourceSet) against real
  # PostgreSQL and Redis service containers.
  # Kafka is provided by @EmbeddedKafka(ports=[0]) declared in BaseIntegrationTest
  # — no Kafka service container needed, and random port prevents collisions.
  # Spring Test context caching (BaseIntegrationTest hierarchy) ensures the broker
  # starts only once per JVM, not per test class.
  # ──────────────────────────────────────────────────────────────────────────
  integration-test:
    name: "2. Integration Tests"
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass
      SPRING_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout backendKotlin
        uses: actions/checkout@v4
        with:
          path: backendKotlin

      - name: Checkout proto
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Generate proto stubs
        run: ./gradlew generateProto --no-daemon

      - name: Wait for Postgres
        working-directory: .
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Wait for Redis
        working-directory: .
        run: |
          for i in $(seq 1 10); do
            redis-cli -h localhost -p 6379 ping && exit 0
            echo "Waiting for Redis... ($i/10)"
            sleep 2
          done
          echo "Redis did not become ready" && exit 1

      - name: Run integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backendKotlin/build/reports/tests/integrationTest/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # ③ Docker Build Verify
  # Builds the multi-stage Docker image without pushing to verify the
  # Dockerfile and build context are correct.
  # Context is workspace root so both backendKotlin/ and proto/ are available,
  # mirroring the Skaffold build context (context: .).
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "3. Docker Build Verify"
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Checkout backendKotlin
        uses: actions/checkout@v4
        with:
          path: backendKotlin

      - name: Checkout proto
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backendKotlin/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
