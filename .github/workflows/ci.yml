name: CI — backendKotlin (Spring Boot)

on:
  push:
    branches: [dev]

# ─────────────────────────────────────────────────────────────────────────────
# Three-stage test pipeline
#
# ① unit-test      — compile + run tests without external services.
#                    Proto stubs generated via Gradle protobuf plugin.
#
# ② integration-test — runs against real PostgreSQL and Redis containers.
#                    Uses Spring environment variables to override datasource.
#                    Runs after unit-test passes.
#
# ③ docker-build   — builds the multi-stage Docker image (no push) to verify
#                    the Dockerfile and build context are valid.
#                    Runs in parallel with ② (both need only unit-test).
#
# Checkout pattern:
#   • backendKotlin repo   → path: backendKotlin/
#   • proto repo           → path: proto/
#   Gives workspace: backendKotlin/ + proto/
#   Gradle's srcDir("../proto") resolves to proto/ ✓
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  run:
    working-directory: backendKotlin

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ① Unit Tests
  # Compiles the project and runs all tests.
  # No external services — Spring context tests that need a DB are expected
  # to use @MockBean / @DataJpaTest with an embedded datasource.
  # ──────────────────────────────────────────────────────────────────────────
  unit-test:
    name: "1. Build & Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backendKotlin
        uses: actions/checkout@v4
        with:
          path: backendKotlin

      - name: Checkout proto
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Generate proto stubs
        run: ./gradlew generateProto --no-daemon

      - name: Build (skip tests)
        run: ./gradlew assemble --no-daemon -x test

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backendKotlin/build/reports/tests/test/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # ② Integration Tests
  # Runs against real PostgreSQL and Redis service containers.
  # Spring datasource and Redis settings are overridden via env vars so no
  # application.yaml changes are required.
  # ──────────────────────────────────────────────────────────────────────────
  integration-test:
    name: "2. Integration Tests"
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"

    steps:
      - name: Checkout backendKotlin
        uses: actions/checkout@v4
        with:
          path: backendKotlin

      - name: Checkout proto
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Generate proto stubs
        run: ./gradlew generateProto --no-daemon

      - name: Wait for Postgres
        working-directory: .
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Run integration tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backendKotlin/build/reports/tests/test/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # ③ Docker Build Verify
  # Builds the multi-stage Docker image without pushing to verify the
  # Dockerfile and build context are correct.
  # Context is workspace root so both backendKotlin/ and proto/ are available,
  # mirroring the Skaffold build context (context: .).
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "3. Docker Build Verify"
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Checkout backendKotlin
        uses: actions/checkout@v4
        with:
          path: backendKotlin

      - name: Checkout proto
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backendKotlin/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
